# House2 microwave 迁移探针 = H2 kettle 锁定配置 f5_t9 平移（REPORT_TEST.md 实录 43）：
#   架构/协议与 fine_h2/f5_t9.yaml 完全一致（w192/d64/h8/L1/ff128/do0/bs128/lr3e-4/wd1e-4，
#   25/5 composite val30000）；仅改 data.appliance=microwave + threshold 200。
#   判定：与 baseline_mw 同 seeds 配对——显著优 → 免粗搜直入细搜级确认；打平/败 → 独立粗搜。
seed: 42
device: auto
data:
  path: ''
  appliance: microwave
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 30000
  max_samples_test: 6000
  eval_test: false
  window_size: 192
model:
  input_dim: 1
  d_model: 64
  nhead: 8
  num_layers: 1
  dim_feedforward: 128
  dropout: 0.0
training:
  batch_size: 128
  epochs: 25
  lr: 0.0003
  weight_decay: 0.0001
  patience: 5
  grad_clip: 1.0
  loss: mse
  select_metric: composite
  objective:
    weights:
      mae: 0.4
      f1: 0.4
      energy_error: 0.2
    mae_norm_watts: 2000.0
metrics:
  on_threshold_watts: 200.0
