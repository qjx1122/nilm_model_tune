# House2 microwave 摸底 baseline（REPORT_TEST.md 实录 43）：
#   架构/训练 = baseline.yaml 同款（30/7 MAE 选型）；纪元适配 = threshold 200（普查确认
#   单峰 1300W/0.035 kWh/evt 合理，口径现成）+ val 30000（val ON≈162@30000 ✓）。
#   迁移探针（probe_mw_f5.yaml）同轮配对：H2 kettle 短事件锁定配置 f5_t9 平移——
#   同 house 跨电器迁移首验（跨纪元结论「架构不迁移」的同环境边界测试）。
seed: 42
device: auto
data:
  path: ''
  appliance: microwave
  window_size: 128
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 30000
  max_samples_test: 6000
model:
  input_dim: 1
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.1
training:
  batch_size: 128
  epochs: 30
  lr: 0.0005
  weight_decay: 0.0001
  patience: 7
  grad_clip: 1.0
  loss: mse
metrics:
  on_threshold_watts: 200.0
