# House2 dish_washer 摸底 baseline（REPORT_TEST.md 实录 44）：
#   架构/训练 = baseline.yaml 同款（30/7 MAE 选型）；纪元适配 = threshold 200（实录 44 四判据定谳：
#   20→200 断崖+200-1000 平台、medW 2014 紧单峰、val ON@30000 609、1.05 kWh/周期闭环——
#   与 H1 dw 口径数值一致，跨 house 口径复用首例）+ val 30000。
#   与 probe_dw_f5（kettle 配方）/probe_dw_d1（H1 dw 配方）构成三方对决。
seed: 42
device: auto
data:
  path: ''
  appliance: dish_washer
  window_size: 128
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 30000
  max_samples_test: 6000
model:
  input_dim: 1
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.1
training:
  batch_size: 128
  epochs: 30
  lr: 0.0005
  weight_decay: 0.0001
  patience: 7
  grad_clip: 1.0
  loss: mse
metrics:
  on_threshold_watts: 200.0
