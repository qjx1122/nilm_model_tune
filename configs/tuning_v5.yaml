# v5 数据纪元重搜配置（REPORT_TEST.md 执行实录 16，双探针结论落地）：
#   探针 A（v2_do00 平移 ×3 seeds）：S 配对全胜（0.033±0.006 vs baseline 0.048±0.006）、
#     val EE 归零（+1.0%±1.0% vs −7.1%±3.0%）→ 旧洞察可迁移，搜索以其邻域为中心；
#   探针 B（100k train ×3 seeds）：S 打平（0.049±0.013 vs 0.048±0.006）、代价 2.7×
#     → 搜索仍用 30k train（数据杠杆暂无可测收益，留待细搜后复核）；
#   val 扩 30000（实录 15：6000 val 下 F1 离散化（33 ON）、S 方差≈全来自 |EE|
#     → 30000 时 ON≈180，判别力恢复）。
# 纪律：eval_test 缺省 False（Test 冻结，新纪元触碰预算剩 1 次=最终锁定）；
#   选型只看 val composite S + 业务硬门槛；trial seed=42+i（单 seed 排名噪声
#   由细搜阶段多 seed 复核消化，v2_do00 作锚候选必入细搜）。
seed: 42
device: auto

data:
  path: ""
  appliance: kettle
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 30000     # 实录 15/16 决策：扩 5 倍提判别力
  max_samples_test: 6000
  eval_test: false

search:
  trials: 32
  report_test: false
  objective:
    metric: composite
    mae_norm_watts: 2000.0
    weights: {mae: 0.4, f1: 0.4, energy_error: 0.2}
    gates:
      enabled: true
      f1_min: 0.75
      recall_min: 0.70
      abs_energy_error_max: 0.15

# 搜索空间：以旧优胜 v2_do00（w128 d64 h8 L2 ff128 do0 bs64 lr3e-4）为中心裁剪。
# 相对旧 tuning.yaml 删去：w64/w256、d32、nhead2、L4、ff512、do0.2、lr1e-4/lr1e-3、
# wd0（旧纪元低天花板或未用区域），保留中心两侧一档探索。
model_search:
  window_size: [96, 128, 192]
  d_model: [64, 128]
  nhead: [4, 8]
  num_layers: [1, 2]
  dim_feedforward: [128, 256]
  dropout: [0.0, 0.1]

training_search:
  batch_size: [64, 128]
  lr: [0.0002, 0.0003, 0.0005]
  weight_decay: [0.00001, 0.0001]
  epochs: 25
  patience: 5

metrics:
  on_threshold_watts: 500.0
