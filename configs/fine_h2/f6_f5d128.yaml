# House2 kettle 细搜批次 1（REPORT_TEST.md 实录 29）：批次 2：f5 × d128（L1 领头羊 × 容量方向——f2 vs f4 显示 d128 方向性优势+EE σ 更小）。
# 协议与粗搜完全一致（25/5 composite、train 30k/val 30000/test 6000、eval_test=false）；
# 种子由 CLI --seed 8000/8001/8002 覆盖（fresh 族，与批次 1 同族）。
seed: 42
device: auto
data:
  path: ''
  appliance: kettle
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 30000
  max_samples_test: 6000
  eval_test: false
  window_size: 192
model:
  input_dim: 1
  d_model: 128
  nhead: 8
  num_layers: 1
  dim_feedforward: 128
  dropout: 0.0
training:
  batch_size: 128
  epochs: 25
  lr: 0.0003
  weight_decay: 0.0001
  patience: 5
  grad_clip: 1.0
  loss: mse
  select_metric: composite
  objective:
    weights:
      mae: 0.4
      f1: 0.4
      energy_error: 0.2
    mae_norm_watts: 2000.0
metrics:
  on_threshold_watts: 500.0
