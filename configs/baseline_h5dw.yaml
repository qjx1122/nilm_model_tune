# House5 dish_washer 摸底 baseline（REPORT_TEST.md 实录 54）：
#   架构/训练 = baseline.yaml 同款（30/7 MAE 选型）；纪元适配 = threshold 200（实录 54 四判据定谳：
#   20→200 断崖 235→96 evt + 200-1000 平台 96/98/99、medW@200+ 恒 1661 紧单峰（第三机型：H1 双峰 120/H2 单峰 2014/H5 单峰 1661）、
#   val ON@30000=291、kWh/evt 0.36-0.44 周期闭环）+ val 30000。
#   与 probe_dw_d1.yaml（=H1/H2 dw 冠军 d1 配方）配对——d1 已连平两 house，本次为跨 house 第三例（迁移三级边界#10 第 4 级检验）。
seed: 42
device: auto
data:
  path: ''
  appliance: dish_washer
  window_size: 128
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 30000
  max_samples_test: 6000
model:
  input_dim: 1
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.1
training:
  batch_size: 128
  epochs: 30
  lr: 0.0005
  weight_decay: 0.0001
  patience: 7
  grad_clip: 1.0
  loss: mse
metrics:
  on_threshold_watts: 200.0
