# 数据量杠杆探针（REPORT_TEST.md 执行实录 15）：与 baseline.yaml 唯一差异 =
#   max_samples_train: 30000 → 100000（train 池 7.26M 中心，linspace 均匀取样）
# 目的：v5 数据纪元 baseline 摸底后，测定「加大训练子采样」的边际收益，
#   为重搜（tune.py）定 train 预算。预期单跑 ~3-6 min（GPU）。
# 纪律：不含 eval_test（缺省 False=Test 冻结）；seeds 用 --seed 逐次覆盖。
seed: 42
device: auto

data:
  path: ""
  appliance: kettle
  window_size: 128
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 100000
  max_samples_val: 6000
  max_samples_test: 6000

model:
  input_dim: 1
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.10

training:
  batch_size: 128
  epochs: 30
  lr: 0.0005
  weight_decay: 0.0001
  patience: 7
  grad_clip: 1.0
  loss: mse

metrics:
  on_threshold_watts: 500.0
