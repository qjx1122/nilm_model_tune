# House2 microwave 细搜批 2 变体 m6_m1L2（REPORT_TEST.md 实录 47）：
#   基座 = configs/fine_mw/m1_do01.yaml（批 1 唯一显著优决赛者：ΔS −0.0159 3/3+>2×SEM；
#   F1 +0.0173 / MAE 3.034 / |EE| 0.69% 全面优——dropout 正则假说命中，稀疏事件电器有效）。
#   单变量：num_layers 1→2（组合探针：m1 正则引擎 + m4 F1 引擎——m4 方向 3/3 但 EE σ 大出局，其 F1 +0.0215 与 m1 的均衡性合并试验）；其余逐字同 m1。seeds 42/2024/7 与 m1 配对。
#   同批：m1 补 seeds 21001/21002（n=5 锁定候选档案）。
seed: 42
device: auto
data:
  path: ''
  appliance: microwave
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 30000
  max_samples_test: 6000
  eval_test: false
  window_size: 192
model:
  input_dim: 1
  d_model: 64
  nhead: 8
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.1
training:
  batch_size: 128
  epochs: 25
  lr: 0.0003
  weight_decay: 0.0001
  patience: 5
  grad_clip: 1.0
  loss: mse
  select_metric: composite
  objective:
    weights:
      mae: 0.4
      f1: 0.4
      energy_error: 0.2
    mae_norm_watts: 2000.0
metrics:
  on_threshold_watts: 200.0
