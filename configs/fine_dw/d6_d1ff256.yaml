# House1 dish_washer 细搜批次 1（REPORT_TEST.md 实录 37）：批次 2：d1 × ff256（粗搜 top-5 的 t10/t13 均 ff256；H2 冠军亦 d64+ff256=4×d）。
# 协议与粗搜完全一致（25/5 composite、train 30k/val 30000/test 6000、threshold 200W、eval_test=false）；
# 种子由 CLI --seed 11000/11001/11002 覆盖（dw 纪元 fresh 族，与批次 1 同族）。
seed: 42
device: auto
data:
  path: ''
  appliance: dish_washer
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 30000
  max_samples_test: 6000
  eval_test: false
  window_size: 192
model:
  input_dim: 1
  d_model: 64
  nhead: 8
  num_layers: 2
  dim_feedforward: 256
  dropout: 0.0
training:
  batch_size: 128
  epochs: 25
  lr: 0.0002
  weight_decay: 1.0e-05
  patience: 5
  grad_clip: 1.0
  loss: mse
  select_metric: composite
  objective:
    weights:
      mae: 0.4
      f1: 0.4
      energy_error: 0.2
    mae_norm_watts: 2000.0
metrics:
  on_threshold_watts: 200.0
