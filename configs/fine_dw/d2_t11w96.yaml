# House1 dish_washer 细搜批次 1（REPORT_TEST.md 实录 37）：trial 11 × w96（窗口交叉：EE 解药是否 w192 特有——w96 族 EE 全负[−5.1%~-9.4%]）。
# 协议与粗搜完全一致（25/5 composite、train 30k/val 30000/test 6000、threshold 200W、eval_test=false）；
# 种子由 CLI --seed 11000/11001/11002 覆盖（dw 纪元 fresh 族；粗搜 42-74、H2 细搜 8000-8004）。
seed: 42
device: auto
data:
  path: ''
  appliance: dish_washer
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 30000
  max_samples_test: 6000
  eval_test: false
  window_size: 96
model:
  input_dim: 1
  d_model: 128
  nhead: 8
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.0
training:
  batch_size: 128
  epochs: 25
  lr: 0.0002
  weight_decay: 1.0e-05
  patience: 5
  grad_clip: 1.0
  loss: mse
  select_metric: composite
  objective:
    weights:
      mae: 0.4
      f1: 0.4
      energy_error: 0.2
    mae_norm_watts: 2000.0
metrics:
  on_threshold_watts: 200.0
