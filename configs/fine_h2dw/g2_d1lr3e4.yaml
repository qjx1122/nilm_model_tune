# House2 dish_washer 细搜批 1 变体 g2_d1lr3e4（REPORT_TEST.md 实录 47）：
#   基座 = configs/probe_dw_d1.yaml（H1 dw 冠军配方 d1_t11d64 平移，实录 47 三方对决显著优 t=−9.21）。
#   单变量：lr 2e-4→3e-4（优化探针——H1 dw 亚军 d5=d1+lr3e4 的重演；d1 best_ep 8-9 居中，lr 提速或有利）；其余逐字同基座。seeds 42/2024/7 与基座配对。
#   同批：d1/f5 各补 seeds 21001/21002（对称化 n=5 裁决平局——实录 47 判定树预注册）。
seed: 42
device: auto
data:
  path: ''
  appliance: dish_washer
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 30000
  max_samples_test: 6000
  eval_test: false
  window_size: 192
model:
  input_dim: 1
  d_model: 64
  nhead: 8
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.0
training:
  batch_size: 128
  epochs: 25
  lr: 0.0003
  weight_decay: 1.0e-05
  patience: 5
  grad_clip: 1.0
  loss: mse
  select_metric: composite
  objective:
    weights:
      mae: 0.4
      f1: 0.4
      energy_error: 0.2
    mae_norm_watts: 2000.0
metrics:
  on_threshold_watts: 200.0
