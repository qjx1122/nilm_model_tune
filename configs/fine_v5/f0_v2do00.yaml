# 细搜批次1·锚候选（REPORT_TEST.md 实录 17）：旧纪元最终优胜 v2_do00 原样平移。
# 与探针 A 唯一差异：max_samples_val 6000→30000（与重搜同口径，判别力）。
seed: 42
device: auto
data:
  path: ""
  appliance: kettle
  window_size: 128
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 30000
  max_samples_test: 6000
  eval_test: false
model:
  input_dim: 1
  d_model: 64
  nhead: 8
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.0
training:
  batch_size: 64
  epochs: 25
  lr: 0.0003
  weight_decay: 0.0001
  patience: 5
  grad_clip: 1.0
  loss: mse
  select_metric: composite
  objective:
    weights: {mae: 0.4, f1: 0.4, energy_error: 0.2}
    mae_norm_watts: 2000.0
metrics:
  on_threshold_watts: 500.0
