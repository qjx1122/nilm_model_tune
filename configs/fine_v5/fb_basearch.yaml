# 细搜批次1·架构锚（实录 17）：baseline 架构（w128 d64 h4 L2 ff128 do0.1 bs128 lr5e-4）
# 协议归一版（25/5 + composite + val30000；原 baseline 30/7+mae 不可比）。
# 作用：回答"搜索找到的架构是否真优于不调参架构"。
seed: 42
device: auto
data:
  path: ""
  appliance: kettle
  window_size: 128
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 30000
  max_samples_test: 6000
  eval_test: false
model:
  input_dim: 1
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.1
training:
  batch_size: 128
  epochs: 25
  lr: 0.0005
  weight_decay: 0.0001
  patience: 5
  grad_clip: 1.0
  loss: mse
  select_metric: composite
  objective:
    weights: {mae: 0.4, f1: 0.4, energy_error: 0.2}
    mae_norm_watts: 2000.0
metrics:
  on_threshold_watts: 500.0
