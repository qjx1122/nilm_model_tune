# 细搜批次1（实录 17）：重搜 top-2 trial29（S=0.0493/EE−0.003）。
# w96 d64 h4 L1 ff256 do0 bs64 lr5e-4 wd1e-5——单层(L1)代表，容量最小化方向。
seed: 42
device: auto
data:
  path: ""
  appliance: kettle
  window_size: 96
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 30000
  max_samples_test: 6000
  eval_test: false
model:
  input_dim: 1
  d_model: 64
  nhead: 4
  num_layers: 1
  dim_feedforward: 256
  dropout: 0.0
training:
  batch_size: 64
  epochs: 25
  lr: 0.0005
  weight_decay: 0.00001
  patience: 5
  grad_clip: 1.0
  loss: mse
  select_metric: composite
  objective:
    weights: {mae: 0.4, f1: 0.4, energy_error: 0.2}
    mae_norm_watts: 2000.0
metrics:
  on_threshold_watts: 500.0
